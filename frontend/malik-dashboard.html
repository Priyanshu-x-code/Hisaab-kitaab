<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malik Panel — Roz Ka Hisaab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <header class="top">
    <div class="crumb"><a class="back-arrow" href="index.html">←</a> Malik Panel</div>
    <div class="stamp"><span class="star">★</span>DATE: <span id="dateOut"></span></div>
  </header>

  <h1 class="title" id="nameOut">—</h1>
  <p class="subtitle">Sabhi workers aur hotels ka hisaab yahan se manage karo</p>

  <nav class="stack">
    <a class="nav-tile" href="malik-workers.html">Worker Info <span class="arrow">→</span></a>
    <a class="nav-tile" href="hotel-account.html">Hotel Info <span class="arrow">→</span></a>
  </nav>

  <button class="btn-danger btn-block" id="logoutBtn" style="margin-top:20px">Logout</button>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById('dateOut').textContent = todayStamp();
const user = Session.requireRole('malik');
if (user) document.getElementById('nameOut').textContent = user.name;

document.getElementById('logoutBtn').addEventListener('click', () => {
  Session.clear();
  window.location.href = 'index.html';
});
</script>
</body>
</html>
